<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictionary review</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Noto Sans Mongolian'; src: url(/font.woff2) format('woff2'); font-display: swap; }
:root {
  --bg: #f7f6f2; --card: #ffffff; --fg: #1c1c1a; --muted: #6d6c66; --line: #e3e1da;
  --accent: #1f5fae; --accent-soft: #e6eef8; --ok: #2e7d4f; --warn: #a15c00; --bad: #b3261e;
  --mongol: 'Noto Sans Mongolian', 'Mongolian Baiti', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --card: #1d1d1b; --fg: #ecebe6; --muted: #9b9a93; --line: #33332f;
    --accent: #7fb0ee; --accent-soft: #1d2a3a; --ok: #6cc28f; --warn: #e0a54a; --bad: #f08a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
h1 { font-size: 18px; margin: 0; }
h1 span { color: var(--muted); font-weight: 400; }
label.inline { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
input, select, button { font: inherit; color: inherit; }
select, input[type=text] { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.progress { margin: 18px 0 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.progress .numbers { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.pct { font-size: 26px; color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--accent-soft); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
.bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.meta { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
.word { font-size: 44px; font-weight: 650; margin: 2px 0 4px; letter-spacing: .01em; }
.example { color: var(--muted); max-width: 70ch; }
.example mark { background: var(--accent-soft); color: var(--fg); border-radius: 3px; padding: 0 2px; }
.prior { margin-top: 6px; font-size: 13px; color: var(--warn); }

.drafts { display: flex; flex-wrap: wrap; gap: 12px; margin: 18px 0 6px; }
.draft { position: relative; display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 12px; background: var(--bg); text-align: left; min-width: 150px; }
.draft:hover { border-color: var(--accent); }
.draft.first { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.key { font: 600 12px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--card); }
.script { font-family: var(--mongol); writing-mode: vertical-lr; font-size: 40px; line-height: 1.1; height: 170px; }
.draft .info { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.latin { font-family: ui-monospace, Consolas, monospace; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 6px; align-self: flex-start; }
.tag.dict { background: var(--accent-soft); color: var(--accent); }
.tag.saved { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.tag.guess { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.none { color: var(--muted); font-size: 14px; padding: 8px 0; }

.editor { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.editor .left { flex: 1 1 320px; min-width: 0; }
.editor label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.editor input { width: 100%; font: 18px ui-monospace, Consolas, monospace; padding: 8px 10px; }
.letters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.letters button { min-width: 36px; font-family: ui-monospace, Consolas, monospace; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.preview { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; min-width: 90px; min-height: 194px; display: flex; align-items: flex-start; }
.preview .error { color: var(--bad); font-size: 13px; writing-mode: horizontal-tb; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.actions .primary { background: var(--accent); color: var(--card); border-color: var(--accent); }
.legend { margin-top: 18px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.recent { margin-top: 22px; }
.recent h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.recent ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.recent li button { display: flex; gap: 8px; align-items: center; padding: 4px 10px; }
.recent .s { font-family: var(--mongol); font-size: 18px; }
.st { font-size: 11px; }
.st.accepted, .st.corrected { color: var(--ok); } .st.unsure { color: var(--warn); } .st.rejected, .st.skipped { color: var(--muted); }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.done { text-align: center; padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Толь шалгах <span>· Dictionary review</span></h1>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <label class="inline">Reviewer <input type="text" id="reviewer" size="12" placeholder="your name"></label>
      <label class="inline">Finish line
        <select id="target">
          <option value="500">top 500</option>
          <option value="2000">top 2,000</option>
          <option value="5000" selected>top 5,000</option>
          <option value="10000">top 10,000</option>
          <option value="20000">all 20,000</option>
        </select>
      </label>
    </div>
  </header>

  <section class="progress" aria-label="Progress">
    <div class="numbers">
      <span class="big" id="done">0</span><span class="big" style="color:var(--muted)" id="total">/ 0 words</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div></div></div>
    <div class="stats">
      <span>Real text covered: <b id="coverage">0%</b></span>
      <span>Needs second look: <b id="unsure">0</b></span>
      <span>Not a word: <b id="rejected">0</b></span>
      <span>This session: <b id="session">0</b> words · <b id="rate">–</b>/hour</span>
      <span>To finish line: <b id="eta">–</b></span>
    </div>
  </section>

  <section class="card" id="card" aria-live="polite"></section>

  <div class="legend">
    <span><span class="key">Enter</span> accept highlighted</span>
    <span><span class="key">1</span>–<span class="key">9</span> pick a draft</span>
    <span><span class="key">E</span> type a correction</span>
    <span><span class="key">U</span> unsure</span>
    <span><span class="key">X</span> not a word</span>
    <span><span class="key">S</span> skip</span>
    <span><span class="key">←</span> back</span>
  </div>

  <section class="recent"><h2>Recent</h2><ol id="recent"></ol></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

const state = await (await fetch('/api/state')).json();
const words = state.words;
const byWord = new Map(words.map((w) => [w.word, w]));
const reviewed = state.reviewed; // word -> latest entry
const DONE = new Set(['accepted', 'corrected']);
const KEEP = new Set(['accepted', 'corrected', 'unsure']);

/** Drafts for a word, with the reviewer's saved spelling first when there is one. */
function draftsFor(entry) {
  const prior = reviewed[entry.word];
  if (!prior || !KEEP.has(prior.status) || !prior.script) return entry.drafts;
  const saved = { script: prior.script, latin: prior.latin ?? '', source: 'saved', guessed: false };
  return [saved, ...entry.drafts.filter((d) => d.script !== prior.script)];
}
const SOURCES = { 'wmk-import': 'khudam dictionary', wiktionary: 'Wiktionary', 'suffix-rule': 'stem + suffix rule' };

let current = null;
let history = []; // words decided this session, for "back"
const session = { count: 0, active: 0, last: Date.now() };
let selected = 0;

$('reviewer').value = store.get('reviewer', '');
$('reviewer').addEventListener('change', (e) => store.set('reviewer', e.target.value.trim()));
$('target').value = store.get('target', '5000');
$('target').addEventListener('change', (e) => { store.set('target', e.target.value); render(); });

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = (n) => n.toLocaleString('en-US');

function nextWord() {
  const target = Number($('target').value);
  const pending = (w) => !reviewed[w.word] || reviewed[w.word].status === 'skipped';
  return (
    words.find((w) => w.rank <= target && !reviewed[w.word]) ??
    words.find((w) => w.rank <= target && pending(w)) ??
    words.find((w) => !reviewed[w.word]) ??
    null
  );
}

function stats() {
  const target = Number($('target').value);
  let done = 0, unsure = 0, rejected = 0, covered = 0;
  for (const w of words) {
    const r = reviewed[w.word];
    if (!r) continue;
    if (DONE.has(r.status)) covered += w.count;
    if (w.rank > target) continue;
    if (DONE.has(r.status)) done++;
    else if (r.status === 'unsure') unsure++;
    else if (r.status === 'rejected') rejected++;
  }
  const total = Math.max(0, Math.min(target, words.length) - rejected);
  return { done, total, unsure, rejected, coverage: covered / state.tokens };
}

function renderProgress() {
  const s = stats();
  const pct = s.total ? (s.done / s.total) * 100 : 0;
  $('done').textContent = fmt(s.done);
  $('total').textContent = `/ ${fmt(s.total)} words`;
  $('pct').textContent = `${pct > 0 && pct < 1 ? pct.toFixed(2) : pct < 10 ? pct.toFixed(1) : Math.round(pct)}%`;
  $('bar').firstElementChild.style.width = `${pct}%`;
  $('bar').setAttribute('aria-valuenow', pct.toFixed(1));
  $('coverage').textContent = `${(s.coverage * 100).toFixed(1)}%`;
  $('unsure').textContent = fmt(s.unsure);
  $('rejected').textContent = fmt(s.rejected);
  $('session').textContent = fmt(session.count);
  const hours = session.active / 3_600_000;
  const rate = hours > 0.01 && session.count >= 5 ? session.count / hours : 0;
  $('rate').textContent = rate ? fmt(Math.round(rate)) : '–';
  const left = s.total - s.done;
  $('eta').textContent = left <= 0 ? 'done' : rate ? `${fmt(left)} words · ~${(left / rate).toFixed(1)} h` : `${fmt(left)} words`;
}

function highlight(example, word) {
  if (!example) return '<em>No example sentence.</em>';
  const re = new RegExp(`(^|[^а-яёөүА-ЯЁӨҮ])(${word.replace(/[-]/g, '\\-')})(?=[^а-яёөүА-ЯЁӨҮ]|$)`, 'iu');
  return escapeHtml(example).replace(re, '$1<mark>$2</mark>');
}

function renderCard() {
  const card = $('card');
  if (!current) {
    card.innerHTML = '<div class="done"><div class="big">Finish line reached 🎉</div><p>Raise the finish line to keep going.</p></div>';
    return;
  }
  const prior = reviewed[current.word];
  const drafts = draftsFor(current);
  selected = 0;
  card.innerHTML = `
    <div class="meta"><span>#${fmt(current.rank)}</span><span>${fmt(current.count)} uses in Wikipedia</span></div>
    <div class="word">${escapeHtml(current.word)}</div>
    <div class="example">${highlight(current.example, current.word)}</div>
    ${prior ? `<div class="prior">Already reviewed: ${prior.status}${prior.script ? ` · <span style="font-family:var(--mongol)">${escapeHtml(prior.script)}</span>` : ''}${prior.reviewer ? ` by ${escapeHtml(prior.reviewer)}` : ''}</div>` : ''}
    <div class="drafts">
      ${drafts.length ? drafts.slice(0, 9).map((d, i) => `
        <button class="draft${i === 0 ? ' first' : ''}" data-i="${i}" aria-label="Accept draft ${i + 1}: ${escapeHtml(d.latin)}">
          <span class="key">${i + 1}</span>
          <span class="script">${escapeHtml(d.script)}</span>
          <span class="info">
            <span class="latin">${escapeHtml(d.latin || '?')}</span>
            <span class="tag ${d.source === 'saved' ? 'saved' : d.guessed ? 'guess' : 'dict'}">${d.source === 'saved' ? `your saved version (${prior.status})` : d.guessed ? 'letter guess' : SOURCES[d.source] ?? d.source}</span>
          </span>
        </button>`).join('') : '<div class="none">No draft. Type the spelling below.</div>'}
    </div>
    <div class="editor">
      <div class="left">
        <label for="latin">Correction: romanization, or paste traditional script</label>
        <input id="latin" type="text" autocomplete="off" spellcheck="false" placeholder="aguljal-a, or paste ᠠᠭᠤᠯᠵᠠᠯ᠎ᠠ" value="${escapeHtml(drafts[0]?.latin || drafts[0]?.script || '')}">
        <div class="letters">${['γ', 'ǰ', 'č', 'š', 'ö', 'ü', '-'].map((l) => `<button type="button" data-letter="${l}">${l}</button>`).join('')}</div>
        <div class="hint">Plain ASCII works: g j ch sh ng kh. Type o: for ö, u: for ü. A space before a suffix becomes NNBSP; "-" is MVS (qar-a). Pasted ᠮᠣᠩᠭᠣᠯ text is used as-is. Enter saves.</div>
      </div>
      <div class="preview" id="preview" aria-label="Preview"></div>
    </div>
    <div class="actions">
      <button class="primary" id="accept">Accept ${drafts.length ? '1' : ''} <span class="key">Enter</span></button>
      <button id="save">Save correction</button>
      <button id="unsureBtn">Unsure <span class="key">U</span></button>
      <button id="reject">Not a word <span class="key">X</span></button>
      <button id="skip">Skip <span class="key">S</span></button>
      <button id="back">Back <span class="key">←</span></button>
    </div>`;

  card.querySelectorAll('.draft').forEach((b) => b.addEventListener('click', () => decide('accepted', drafts[Number(b.dataset.i)].script)));
  card.querySelectorAll('[data-letter]').forEach((b) => b.addEventListener('click', () => {
    const input = $('latin');
    const at = input.selectionStart ?? input.value.length;
    input.value = input.value.slice(0, at) + b.dataset.letter + input.value.slice(input.selectionEnd ?? at);
    input.focus();
    input.setSelectionRange(at + 1, at + 1);
    preview();
  }));
  $('latin').addEventListener('input', preview);
  $('latin').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveCorrection(); }
    if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); }
  });
  $('accept').addEventListener('click', () => drafts.length ? decide('accepted', drafts[0].script) : saveCorrection());
  $('save').addEventListener('click', saveCorrection);
  $('unsureBtn').addEventListener('click', () => decide('unsure', previewScript ?? drafts[0]?.script ?? ''));
  $('reject').addEventListener('click', () => decide('rejected', ''));
  $('skip').addEventListener('click', () => decide('skipped', ''));
  $('back').addEventListener('click', back);
  previewScript = null;
  preview(0);
}

let previewScript = null;
let previewTimer = 0;
function preview(delay = 120) {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    const latin = $('latin')?.value ?? '';
    const box = $('preview');
    if (!box) return;
    if (!latin.trim()) { previewScript = null; box.innerHTML = ''; return; }
    const r = await (await fetch(`/api/script?latin=${encodeURIComponent(latin)}`)).json();
    previewScript = r.script ?? null;
    box.innerHTML = r.script ? `<span class="script">${escapeHtml(r.script)}</span>` : `<span class="error">${escapeHtml(r.error)}</span>`;
  }, typeof delay === 'number' ? delay : 120);
}

async function saveCorrection() {
  const latin = $('latin').value;
  const r = await (await fetch(`/api/script?latin=${encodeURIComponent(latin)}`)).json();
  if (!r.script) return toast(`Cannot convert: ${r.error}`);
  const isDraft = current.drafts.some((d) => d.script === r.script);
  decide(isDraft ? 'accepted' : 'corrected', r.script);
}

async function decide(status, script) {
  if (!current) return;
  // Keeping a saved correction keeps it a correction.
  const prior = reviewed[current.word];
  if (status === 'accepted' && prior?.status === 'corrected' && prior.script === script) status = 'corrected';
  // Skipping a word that already has a decision just moves on; it never erases it.
  if (status === 'skipped' && prior && prior.status !== 'skipped') {
    current = nextWord();
    return render();
  }
  const reviewer = $('reviewer').value.trim();
  const res = await fetch('/api/review', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ word: current.word, script, status, reviewer }),
  });
  const entry = await res.json();
  if (!res.ok) return toast(entry.error ?? 'Save failed');
  reviewed[current.word] = entry;
  const now = Date.now();
  session.active += Math.min(now - session.last, 120_000); // idle gaps count as 2 minutes at most
  session.last = now;
  session.count++;
  history.push(current.word);
  addRecent(entry);
  current = nextWord();
  render();
}

function back() {
  const word = history.pop();
  if (!word) return toast('Nothing to go back to in this session');
  current = byWord.get(word);
  render();
}

const recent = [];
function addRecent(entry) {
  const at = recent.findIndex((r) => r.word === entry.word);
  if (at >= 0) recent.splice(at, 1);
  recent.unshift(entry);
  recent.length = Math.min(recent.length, 10);
}
function renderRecent() {
  $('recent').innerHTML = recent.map((e) => `
    <li><button data-word="${escapeHtml(e.word)}">${escapeHtml(e.word)}
      ${e.script ? `<span class="s">${escapeHtml(e.script)}</span>` : ''}
      <span class="st ${e.status}">${e.status}</span></button></li>`).join('');
  $('recent').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { current = byWord.get(b.dataset.word); render(); }));
}

let toastTimer = 0;
function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
}

function render() {
  renderProgress();
  renderCard();
  renderRecent();
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey || !current) return;
  const drafts = draftsFor(current);
  if (e.key === 'Enter') { e.preventDefault(); drafts.length ? decide('accepted', drafts[0].script) : $('latin').focus(); }
  else if (/^[1-9]$/.test(e.key) && drafts[Number(e.key) - 1]) { e.preventDefault(); decide('accepted', drafts[Number(e.key) - 1].script); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); const i = $('latin'); i.focus(); i.select(); }
  else if (e.key === 'u' || e.key === 'U') { e.preventDefault(); decide('unsure', previewScript ?? drafts[0]?.script ?? ''); }
  else if (e.key === 'x' || e.key === 'X') { e.preventDefault(); decide('rejected', ''); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); decide('skipped', ''); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); back(); }
});

// Resume where the file left off: recent decisions and "back" survive a reload.
for (const entry of Object.values(reviewed).sort((a, b) => a.at.localeCompare(b.at))) {
  history.push(entry.word);
  addRecent(entry);
}
current = nextWord();
render();
</script>
</body>
</html>
